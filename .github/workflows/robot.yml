name: Robot Yo Soy Veedor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/robot.mjs', '.github/workflows/robot.yml']

permissions:
  contents: write

concurrency:
  group: robot-veedor
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Traer resumen del SECOP, municipios y noticias
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: node scripts/robot.mjs
      - name: Guardar cambios
        run: |
          git config user.name "robot-yo-soy-veedor"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Robot: actualiza SECOP y noticias $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main || true
            git push
          fi
